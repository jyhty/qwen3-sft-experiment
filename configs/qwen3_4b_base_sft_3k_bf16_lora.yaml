# Model and LoRA
model_name_or_path: models/Qwen3-4B-Base
trust_remote_code: false
flash_attn: sdpa
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0

# Data and loss masking
dataset_dir: data/sft
dataset: tulu3_3k
eval_dataset: tulu3_val
template: qwen3_nothink
cutoff_len: 2048
train_on_prompt: false
mask_history: false
packing: false
preprocessing_num_workers: 4
dataloader_num_workers: 2

# Single-GPU BF16 training
bf16: true
disable_gradient_checkpointing: false
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
num_train_epochs: 3.0
learning_rate: 0.0001
optim: adamw_torch
lr_scheduler_type: cosine
warmup_ratio: 0.1
seed: 42

# Validation, logs, and checkpoints
do_eval: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 75
logging_steps: 10
output_dir: outputs/classroom-qwen3-4b-bf16-lora
save_strategy: epoch
save_total_limit: 3
save_only_model: false
plot_loss: true
report_to: none
overwrite_output_dir: false
